services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fid-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    restart: "no"

  alloy:
    image: grafana/alloy:latest
    container_name: fid-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro,z
    ports:
      - "12345:12345"
    depends_on:
      - prometheus
    restart: "no"

  grafana:
    image: grafana/grafana:latest
    container_name: fid-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro,z
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: "no"

  dozzle:
    image: amir20/dozzle:latest
    container_name: fid-dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    restart: "no"

volumes:
  grafana-data:

networks:
  default:
    name: monitoreo
    external: true
